<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found</title>
    <style>
        body {
            background-color: #2c0a2f;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Courier New', monospace;
            flex-direction: column;
        }
        h1 {
            color: #a45fa8;
            font-weight: bold;
            font-size: 5rem;
            margin: 0;
        }
        p {
            color: #a45fa8;
            font-size: 1.5rem;
            margin-top: 0.5rem;
            height: 1.8rem; /* Fixed height to prevent layout shift */
        }
    </style>
</head>
<body>
    <h1>404</h1>
    <p id="message"></p>

    <script>
        const messageElement = document.getElementById("message");
        let dotCount = 0;
        let timer = 0;
        let currentMessage = "Not Found";
        let isTyping = false;
        let typedText = "";

        // Type the initial message
        typeMessage(currentMessage);

        function typeMessage(text) {
            isTyping = true;
            typedText = "";
            let charIndex = 0;
            
            function type() {
                if (charIndex < text.length) {
                    typedText += text.charAt(charIndex);
                    messageElement.textContent = typedText;
                    charIndex++;
                    setTimeout(type, 100); // Typing speed
                } else {
                    isTyping = false;
                    startDotAnimation();
                }
            }
            
            type();
        }

        function startDotAnimation() {
            dotCount = 0;
            updateDots();
        }

        function updateDots() {
            if (!isTyping) {
                dotCount = (dotCount + 1) % 4; // 0-3
                const dots = ".".repeat(dotCount);
                messageElement.textContent = currentMessage + dots;
            }
        }

        // Main timer
        const interval = setInterval(() => {
            timer++;
            
            // After 10 seconds, change message
            if (timer === 10) {
                currentMessage = "You've been here long enough";
                typeMessage(currentMessage);
            }
            
            // After 20 seconds, redirect
            if (timer === 20) {
                clearInterval(interval);
                window.location.href = "/index.html";
            }
        }, 1000);

        // Animate dots every 500ms
        setInterval(updateDots, 500);
    </script>
</body>
</html>
