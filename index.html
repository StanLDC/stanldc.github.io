<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>StanLDC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dosis:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <div class="content">
      <h1>StanLDC</h1>

      <nav aria-label="Social links">
        <a href="https://youtube.com/@stanldc">Youtube</a>
        <a href="https://www.tiktok.com/@stanldc">Tiktok</a>
        <a href="https://youtube.com/@ldcvods">Youtube 2nd Channel</a>
        <a href="https://stanldc.com/discord">Discord</a>
      </nav>
    </div>
  </main>
</body>

<style>
  * {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  min-height: 100%;
  margin: 0;
}

body {
  font-family: "Dosis", sans-serif;
  overflow-x: hidden;
}

.page {
  position: relative;
  min-height: 100vh;
  min-height: 100svh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: clamp(45px, 8vh, 100px) 24px 50px;
  isolation: isolate;

  background: url("background.jpg") center center / cover no-repeat fixed;
}

.content {
  width: min(900px, 100%);
  text-align: center;
}

h1,
nav a {
  color: #6bb1f6;
  font-style: italic;
  font-weight: 800;
  -webkit-text-stroke: 7px #fff;
  paint-order: stroke fill;
}

h1 {
  margin: 0 0 clamp(35px, 7vh, 70px);
  font-size: clamp(70px, 13vw, 150px);
  line-height: 0.9;
  letter-spacing: 1px;
}

nav {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: clamp(18px, 3.5vh, 32px);
}

nav a {
  display: inline-block;
  width: fit-content;
  max-width: 100%;
  font-size: clamp(36px, 6vw, 68px);
  line-height: 1;
  text-decoration: none;
  transition: transform 0.15s ease, filter 0.15s ease;
}

nav a:hover,
nav a:focus-visible {
  transform: scale(1.04);
  filter: brightness(1.05);
}

nav a:focus-visible {
  outline: 3px solid #6bb1f6;
  outline-offset: 8px;
  border-radius: 8px;
}

@media (max-width: 600px) {
  .page {
    padding-left: 16px;
    padding-right: 16px;
    background-attachment: scroll;
  }

  h1,
  nav a {
    -webkit-text-stroke: clamp(3px, 1.5vw, 7px) #fff;
  }

  h1 {
    font-size: clamp(64px, 20vw, 100px);
  }

  nav a {
    font-size: clamp(34px, 10vw, 58px);
  }
}
</style>
</html>
