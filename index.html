<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5; 
            flex-direction: column; 
        }
        
        .error-code {
            font-size: 72px;
            font-weight: bold;
            color: purple;
            text-shadow: 4px 4px 6px rgba(0, 0, 0, 0.3); 
            margin-bottom: 16px; 
        }
        
        .lost-message {
            font-size: 18px;
            color: #555; 
            font-style: italic;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="error-code">404</div>
    <div class="lost-message">I think you're lost.<br>You're not alone though, I'm just as lost.</div>
</body>
</html>
