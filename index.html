<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StanLDC</title>
    <style>
        @font-face {
            font-family: 'Keripik';
            src: url('assets/fonts/keripik.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        body {
            font-family: 'Keripik', sans-serif;
            margin: 0;
            padding: 0;
            background-image: url('assets/images/background.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            color: black;
            text-align: center;
        }

        .banner-container {
            width: 100%;
            text-align: center;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
            padding: 10px 0;
        }

        .banner-group {
            display: inline-block;
            margin: 0 auto;
        }

        .banner-image {
            width: 450px;
            height: auto;
            vertical-align: middle;
        }

        .banner-smile {
            width: 100px;
            height: auto;
            vertical-align: middle;
            margin-left: 10px;
        }

        .links-container {
            position: absolute;
            top: 35%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
        }

        .links-title {
            font-size: 3rem;
            margin-bottom: 45px; /* Reduced to bring links closer */
            color: black;
            text-shadow: 1px 1px 3px rgba(255,255,255,0.5);
        }

        .links-grid {
            display: flex;
            justify-content: center;
            gap: 50px;
            margin-top: -40px; /* Added to push links down slightly */
        }

        .link {
            color: black;
            text-decoration: none;
            font-size: 2rem;
            transition: 0.3s;
            font-weight: bold;
            text-shadow: 1px 1px 3px rgba(255,255,255,0.5);
            position: relative;
            top: 5px; /* Additional slight downward adjustment */
        }

        .link:hover {
            opacity: 0.8;
            transform: scale(1.1);
        }
                .credits-link {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: black;
            text-decoration: none;
            font-size: 1.2rem;
            font-family: 'Keripik', sans-serif;
            transition: all 0.3s ease;
            text-shadow: 1px 1px 3px rgba(255,255,255,0.5);
        }

        .credits-link:hover {
            transform: translateX(-50%) scale(1.1);
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="banner-container">
        <div class="banner-group">
            <img src="assets/images/bannertext.png" alt="Banner Text" class="banner-image">
            <img src="assets/images/bannersmile.png" alt="Smile" class="banner-smile">
        </div>
    </div>

    <div class="links-container">
        <h1 class="links-title">Links:</h1>
        <div class="links-grid">
            <a href="https://youtube.com/@stanldc" class="link" target="_blank">YouTube</a>
            <a href="https://twitch.tv/stanldc_" class="link" target="_blank">Twitch</a>
            <a href="https://x.com/ldctwo" class="link" target="_blank">Twitter</a>
        </div>
    </div>
        <a href="/credits" class="credits-link">Credits</a>
</body>
</html>
