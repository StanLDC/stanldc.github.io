<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Forever Sherry Jones — Lesbian Flag + EXPLOSIONS</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #111;
      font-family: "Comic Sans MS", cursive, sans-serif;
      font-size: 28px;
      line-height: 1.4;
      cursor: pointer;
    }

    #container {
      padding: 20px;
      text-align: center;
    }

    .line {
      margin: 6px 0;
      white-space: nowrap;
    }

    #explodeAudio {
      position: absolute;
      left: -9999px;
    }
  </style>
</head>
<body>
  <audio id="explodeAudio" src="explode.mp3" loop></audio>

  <div id="container"></div>

  <script>
    const colors = [
      '#d52d00', // dark orange
      '#ef7627', // light orange
      '#ffffff', // white
      '#d162a4', // pink
      '#b55690', // dark pink
      '#a30262'  // deep pink
    ];

    const container = document.getElementById('container');
    const audio = document.getElementById('explodeAudio');
    let audioStarted = false;

    function addLine() {
      const line = document.createElement('div');
      line.className = 'line';
      line.textContent = 'sherry jones';
      const colorIndex = container.children.length % colors.length;
      line.style.color = colors[colorIndex];
      if (colors[colorIndex] === '#ffffff') {
        line.style.textShadow = '0 0 4px rgba(0,0,0,0.7)';
      }
      container.appendChild(line);
    }

    for (let i = 0; i < 60; i++) {
      addLine();
    }

    window.addEventListener('scroll', () => {
      if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 800) {
        for (let i = 0; i < 30; i++) {
          addLine();
        }
      }
    });

    function startAudio() {
      if (!audioStarted) {
        audio.volume = 1.0;
        audio.play().then(() => {
          audioStarted = true;
        }).catch(e => {
          console.warn("Audio play was blocked:", e);
        });
      }
    }

    document.body.addEventListener('click', startAudio);
    document.body.addEventListener('touchstart', startAudio, { once: true });
  </script>
</body>
</html>
