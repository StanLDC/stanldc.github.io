<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Explode</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #111;
      font-family: "Comic Sans MS", cursive, sans-serif;
      font-size: 28px;
      line-height: 1.4;
      cursor: pointer;
    }
    #container {
      padding: 20px;
      text-align: center;
    }
    .line {
      margin: 6px 0;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="container"></div>

  <script>
    const colors = ['#d52d00', '#ef7627', '#ffffff', '#d162a4', '#b55690', '#a30262'];
    const container = document.getElementById('container');
    const audio = new Audio('explode.mp3');
    audio.loop = true;
    audio.volume = 0.6;
    let audioStarted = false;
    function addLine() {
      const line = document.createElement('div');
      line.className = 'line';
      line.textContent = 'sherry jones';
      const colorIndex = container.children.length % colors.length;
      line.style.color = colors[colorIndex];
      if (colors[colorIndex] === '#ffffff') {
        line.style.textShadow = '0 0 4px rgba(0,0,0,0.7)';
      }
      container.appendChild(line);
    }
    for (let i = 0; i < 60; i++) addLine();

    window.addEventListener('scroll', () => {
      if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 800) {
        for (let i = 0; i < 30; i++) addLine();
      }
    });

    function startAudio() {
      if (!audioStarted) {
        audio.play().catch(e => console.warn("Audio blocked:", e));
        audioStarted = true;
      }
    }

    document.body.addEventListener('click', startAudio);
    document.body.addEventListener('touchstart', startAudio, { once: true });
  </script>
</body>
</html>
